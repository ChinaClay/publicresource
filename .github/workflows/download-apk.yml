name: Download APK to Vehicle/apks

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK via curl
        run: |
          curl -L -o "Vehicle/apks/BaiduMapForAuto_AndroidPhone_22-1-3-1_x640001.apk"
          date >> Vehicle/apks/.log
          echo "[OK]" >> Vehicle/apks/.log

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Vehicle/apks/
          git commit -m "Download APK to Vehicle/apks" || exit 0
          git push